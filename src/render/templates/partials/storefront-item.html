<article class="storefront-item">
  <div class="store-rank">{{RANK}}</div>
  {{IMAGE}}
  <div class="store-main">
    <div class="store-name">{{NAME}}</div>
    <div class="store-description">{{DESCRIPTION}}</div>
  </div>
  <div class="store-price">
    {{ORIGINAL_PRICE}}
    {{DISCOUNT}}
    <b>{{PRICE}}</b>
  </div>
</article>
