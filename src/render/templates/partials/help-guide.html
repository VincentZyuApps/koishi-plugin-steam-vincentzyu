<section class="help-guide">
  <div class="guide-title">🧭 指令格式示范</div>
  <div class="guide-example">
    <div class="command">steam.子指令名 [参数1]</div>
    <div class="aliases">
      <div class="alias alias-chinese"><span>中文别名</span><code>steam.中文别名 [参数1]</code></div>
      <div class="alias alias-english"><span>English</span><code>steam.sub-command-name [argument1]</code></div>
    </div>
  </div>
  <p><code>&lt;参数&gt;</code> 为必填，<code>[参数]</code> 为可选；主命令和两个别名均可直接执行。</p>
  <p>🖼️ 出图指令可临时传 <code>-t, --image-timeout &lt;秒&gt;</code>（1-30）和 <code>-s, --settle-ms &lt;毫秒&gt;</code>（0-10000）；省略时使用插件配置。</p>
</section>
